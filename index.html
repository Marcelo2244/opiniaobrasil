<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opinião Brasil</title>
  <meta name="description" content="Comentários e vídeos sobre o Brasil.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="marked.min.js"></script>
  <style>
    :root {
      --bg: #f7f7f4;
      --papel: #ffffff;
      --texto: #17201b;
      --suave: #5f6b64;
      --linha: #e2e5df;
      --verde: #0f5c3a;
      --amarelo: #f2c230;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--texto); font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; line-height: 1.7; }
    a { color: inherit; }
    .container { max-width: 760px; margin: 0 auto; padding: 0 22px; }

    header { background: var(--verde); color: #fff; border-bottom: 4px solid var(--amarelo); }
    .topo { padding: 34px 0 26px; }
    .marca { font-family: 'Inter', sans-serif; font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em; text-decoration: none; }
    .marca span { color: var(--amarelo); }
    .lema { opacity: 0.82; margin-top: 2px; font-style: italic; }
    nav { display: flex; gap: 6px; margin-top: 20px; }
    nav button {
      font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600; cursor: pointer;
      background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.35);
      border-radius: 999px; padding: 6px 15px;
    }
    nav button:hover { border-color: #fff; }
    nav button.ativo { background: var(--amarelo); border-color: var(--amarelo); color: var(--texto); }

    main { padding: 36px 0 80px; min-height: 60vh; }

    .cartao {
      background: var(--papel); border: 1px solid var(--linha); border-radius: 10px;
      overflow: hidden; margin-bottom: 22px; display: block; text-decoration: none;
      transition: box-shadow .15s, transform .15s;
    }
    .cartao:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.07); transform: translateY(-1px); }
    .cartao .corpo { padding: 20px 24px 22px; }
    .cartao h2 { font-size: 1.4rem; line-height: 1.3; margin: 6px 0 6px; }
    .resumo { color: var(--suave); }
    .miniatura { position: relative; aspect-ratio: 16 / 9; background: #000; }
    .miniatura img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.92; }
    .play {
      position: absolute; inset: 0; margin: auto; width: 68px; height: 48px; border-radius: 12px;
      background: rgba(204, 0, 0, 0.92); display: flex; align-items: center; justify-content: center;
    }
    .play::after { content: ''; border-left: 18px solid #fff; border-top: 11px solid transparent; border-bottom: 11px solid transparent; margin-left: 4px; }

    .meta { font-family: 'Inter', sans-serif; font-size: 0.75rem; color: var(--suave); text-transform: uppercase; letter-spacing: 0.06em; display: flex; gap: 10px; align-items: center; }
    .tipo { font-weight: 700; color: var(--verde); }
    .tipo.video { color: #b3261e; }
    .vazio { color: var(--suave); font-style: italic; }

    .voltar { font-family: 'Inter', sans-serif; font-size: 0.85rem; color: var(--suave); text-decoration: none; display: inline-block; margin-bottom: 22px; }
    .voltar:hover { color: var(--texto); }
    article h1 { font-size: 2.2rem; line-height: 1.2; margin: 8px 0 26px; }
    .video-box { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000; margin: 0 0 28px; }
    .video-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .conteudo p { margin-bottom: 1.3em; }
    .conteudo h2 { font-size: 1.45rem; margin: 1.8em 0 0.6em; }
    .conteudo h3 { font-size: 1.2rem; margin: 1.5em 0 0.5em; }
    .conteudo blockquote { border-left: 4px solid var(--amarelo); padding: 4px 0 4px 18px; margin: 1.5em 0; color: var(--suave); font-style: italic; }
    .conteudo ul, .conteudo ol { margin: 0 0 1.3em 1.4em; }
    .conteudo a { color: var(--verde); }
    .conteudo img { max-width: 100%; border-radius: 8px; }
    .conteudo hr { border: none; border-top: 1px solid var(--linha); margin: 2em 0; }

    footer { border-top: 1px solid var(--linha); padding: 26px 0 44px; font-family: 'Inter', sans-serif; font-size: 0.8rem; color: var(--suave); }

    @media (max-width: 560px) {
      body { font-size: 17px; }
      .marca { font-size: 1.55rem; }
      article h1 { font-size: 1.7rem; }
      .cartao .corpo { padding: 16px 18px 18px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container topo">
      <a href="#/" class="marca">Opinião <span>Brasil</span></a>
      <p class="lema">Comentários e vídeos sobre o país.</p>
      <nav id="filtros">
        <button data-f="todos" class="ativo">Tudo</button>
        <button data-f="comentario">Comentários</button>
        <button data-f="video">Vídeos</button>
      </nav>
    </div>
  </header>

  <main>
    <div class="container" id="app"><p class="vazio">Carregando…</p></div>
  </main>

  <footer>
    <div class="container">As opiniões aqui publicadas são pessoais.</div>
  </footer>

  <script>
    const app = document.getElementById('app');
    let posts = [];
    let filtro = 'todos';

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // Extrai o código do vídeo de qualquer formato de link do YouTube
    const idYoutube = url => {
      const m = String(url || '').match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
      return m ? m[1] : null;
    };
    const embed = id => `<div class="video-box"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="Vídeo do YouTube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;

    // Um link do YouTube sozinho numa linha do texto vira vídeo incorporado
    function videosNoTexto(html) {
      const d = document.createElement('div');
      d.innerHTML = html;
      d.querySelectorAll('p').forEach(p => {
        const id = idYoutube(p.textContent.trim());
        if (id && /^https?:\/\/\S+$/.test(p.textContent.trim())) p.outerHTML = embed(id);
      });
      return d.innerHTML;
    }

    const formatarData = iso => {
      const [a, m, d] = iso.split('-').map(Number);
      return new Date(a, m - 1, d).toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });
    };

    const meta = p => {
      const v = !!idYoutube(p.video);
      return `<div class="meta"><span class="tipo ${v ? 'video' : ''}">${v ? 'Vídeo' : 'Comentário'}</span><span>${formatarData(p.data)}</span></div>`;
    };

    function renderLista() {
      document.title = 'Opinião Brasil';
      const lista = posts.filter(p => {
        const v = !!idYoutube(p.video);
        return filtro === 'todos' || (filtro === 'video' ? v : !v);
      });
      if (!lista.length) {
        app.innerHTML = '<p class="vazio">Nada publicado aqui ainda.</p>';
        return;
      }
      app.innerHTML = lista.map(p => {
        const id = idYoutube(p.video);
        return `
          <a class="cartao" href="#/post/${encodeURIComponent(p.slug)}">
            ${id ? `<div class="miniatura"><img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy"><div class="play"></div></div>` : ''}
            <div class="corpo">
              ${meta(p)}
              <h2>${esc(p.titulo)}</h2>
              ${p.resumo ? `<p class="resumo">${esc(p.resumo)}</p>` : ''}
            </div>
          </a>`;
      }).join('');
    }

    async function renderPost(slug) {
      const p = posts.find(x => x.slug === slug);
      if (!p) { app.innerHTML = '<p class="vazio">Publicação não encontrada.</p>'; return; }
      app.innerHTML = '<p class="vazio">Carregando…</p>';
      let md = '';
      try {
        const r = await fetch(`posts/${encodeURIComponent(slug)}.md`, { cache: 'no-cache' });
        if (r.ok) md = await r.text();
      } catch {}
      const id = idYoutube(p.video);
      document.title = `${p.titulo} — Opinião Brasil`;
      app.innerHTML = `
        <a href="#/" class="voltar">← Voltar</a>
        <article>
          ${meta(p)}
          <h1>${esc(p.titulo)}</h1>
          ${id ? embed(id) : ''}
          <div class="conteudo">${videosNoTexto(marked.parse(md))}</div>
        </article>`;
      window.scrollTo(0, 0);
    }

    function rotear() {
      const m = location.hash.match(/^#\/post\/(.+)$/);
      document.getElementById('filtros').style.display = m ? 'none' : 'flex';
      m ? renderPost(decodeURIComponent(m[1])) : renderLista();
    }

    document.getElementById('filtros').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      filtro = b.dataset.f;
      document.querySelectorAll('#filtros button').forEach(x => x.classList.toggle('ativo', x === b));
      renderLista();
    });
    window.addEventListener('hashchange', rotear);

    fetch('posts/posts.json', { cache: 'no-cache' })
      .then(r => r.json())
      .then(d => { posts = d.sort((a, b) => b.data.localeCompare(a.data)); rotear(); })
      .catch(() => { app.innerHTML = '<p class="vazio">Não foi possível carregar as publicações.</p>'; });
  </script>
</body>
</html>
